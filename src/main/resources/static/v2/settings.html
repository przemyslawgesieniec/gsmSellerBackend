<!DOCTYPE html>
<html lang="pl">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="light" name="color-scheme"/>
  <title>
   Ustawienia · GSM Workspace
  </title>
  <link href="/favicon.ico" rel="icon"/>
  <link href="assets/vendor/tom-select.css" rel="stylesheet"/>
  <link href="assets/vendor/flatpickr.css" rel="stylesheet"/>
  <link href="assets/css/workspace.css" rel="stylesheet"/>
 </head>
 <body data-page="settings">
  <a class="skip-link" href="#main-content">
   Przejdź do treści
  </a>
  <div id="workspaceShell">
  </div>
  <main class="workspace-main" id="main-content" tabindex="-1">
   <header class="page-heading">
    <div>
     <p class="eyebrow">
      Zarządzanie
     </p>
     <h1>
      Ustawienia
     </h1>
     <p class="page-description">
      Twoja lokalizacja, zespół i dostęp do aplikacji.
     </p>
    </div>
    <div class="page-actions" id="pageActions">
    </div>
   </header>
   <div class="container">
    <div class="form-grid">
     <div class="grid-cell span-s-12 span-m-12 span-l-12">
      <div class="panel location-settings hide">
       <div class="panel-body">
        <div class="form-grid">
         <span class="panel-title blue-text text-darken-2">
          Ustawienia lokalizacji
         </span>
         <p class="grey-text">
          Twoja aktualna lokalizacja:
          <b id="currentLocationLabel">
           —
          </b>
         </p>
         <div class="grid-cell span-l-12 span-s-12 hide location-select-wrapper">
          <label class="active" for="locationSelect">
           Zmień lokalizację
          </label>
          <select id="locationSelect">
          </select>
         </div>
        </div>
       </div>
      </div>
      <div class="panel admin-only hide">
       <div class="panel-body">
        <span class="panel-title blue-text">
         Użytkownicy aplikacji
        </span>
        <div class="admin-only hide">
         <table class="highlight responsive-table">
          <thead>
           <tr>
            <th>
             Email
            </th>
            <th>
             Lokalizacja
            </th>
            <th>
             Aktywne konto
            </th>
            <th>
             Tryb lokalizacji
            </th>
           </tr>
          </thead>
          <tbody id="usersTableBody">
          </tbody>
         </table>
        </div>
       </div>
      </div>
     </div>
    </div>
   </div>
   <footer class="workspace-footer">
    <span>
     Teleakcesoria · GSM Workspace
    </span>
    <a href="/settings.html" id="legacyViewLink">
     Klasyczny widok
    </a>
   </footer>
  </main>
  <script src="assets/vendor/lucide.js">
  </script>
  <script src="assets/vendor/tom-select.js">
  </script>
  <script src="assets/vendor/flatpickr.js">
  </script>
  <script src="assets/vendor/flatpickr-pl.js">
  </script>
  <script src="assets/js/ui.js">
  </script>
  <script src="assets/js/auth.js">
  </script>
  <script src="assets/js/shell.js">
  </script>
  <script src="assets/js/userSettings.js">
  </script>
  <script src="assets/js/settings-init.js">
  </script>
 </body>
</html>
